<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub URL auto refresher · every 1s</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0d1117;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #c9d1d9;
        }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 2rem 2rem 2.2rem;
            max-width: 680px;
            width: 100%;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.7), 0 0 0 1px #2d333b inset;
        }

        .github-badge {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 1.8rem;
            font-size: 1.2rem;
            font-weight: 500;
            color: #e6edf3;
            letter-spacing: -0.01em;
        }

        .github-badge svg {
            fill: #f0f6fc;
            filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
            width: 28px;
            height: 28px;
        }

        .github-badge span {
            background: #21262d;
            padding: 0.2rem 0.75rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 400;
            color: #8b949e;
            border: 1px solid #30363d;
            margin-left: 0.25rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-bottom: 1.5rem;
        }

        .input-group label {
            font-size: 0.85rem;
            font-weight: 500;
            color: #8b949e;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .input-group label svg {
            fill: #8b949e;
            width: 14px;
            height: 14px;
        }

        .url-input-wrapper {
            display: flex;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 10px;
            transition: border-color 0.2s, box-shadow 0.2s;
            overflow: hidden;
        }

        .url-input-wrapper:focus-within {
            border-color: #388bfd;
            box-shadow: 0 0 0 3px rgba(56, 139, 253, 0.25);
        }

        .url-input-wrapper input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.9rem 1rem;
            font-size: 1rem;
            color: #e6edf3;
            outline: none;
            font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
            font-size: 0.95rem;
            letter-spacing: -0.2px;
        }

        .url-input-wrapper input::placeholder {
            color: #484f58;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 0.95rem;
        }

        .url-input-wrapper button {
            background: #238636;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 0 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: background 0.2s;
            border-left: 1px solid #2ea043;
            white-space: nowrap;
        }

        .url-input-wrapper button:hover {
            background: #2ea043;
        }

        .url-input-wrapper button:active {
            background: #238636;
        }

        .url-input-wrapper button svg {
            fill: white;
            width: 16px;
            height: 16px;
        }

        .status-panel {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.8rem;
        }

        .status-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .pulse-dot {
            width: 12px;
            height: 12px;
            background: #3fb950;
            border-radius: 50%;
            box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.7);
            animation: pulse 1.4s infinite;
            flex-shrink: 0;
        }

        .pulse-dot.idle {
            background: #484f58;
            box-shadow: none;
            animation: none;
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(63, 185, 80, 0.7);
            }
            70% {
                box-shadow: 0 0 0 8px rgba(63, 185, 80, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(63, 185, 80, 0);
            }
        }

        .status-text {
            font-size: 0.9rem;
            color: #c9d1d9;
        }

        .status-text strong {
            color: #e6edf3;
            font-weight: 600;
        }

        .status-text .countdown {
            background: #21262d;
            padding: 0.15rem 0.6rem;
            border-radius: 16px;
            font-family: 'SF Mono', monospace;
            font-size: 0.85rem;
            color: #e6edf3;
            border: 1px solid #30363d;
            margin-left: 0.4rem;
        }

        .toggle-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #e6edf3;
            padding: 0.45rem 1.1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: background 0.2s, border-color 0.2s;
            white-space: nowrap;
        }

        .toggle-btn:hover {
            background: #30363d;
            border-color: #484f58;
        }

        .toggle-btn.stop {
            color: #f85149;
            border-color: #f8514933;
        }

        .toggle-btn.stop:hover {
            background: #f8514910;
            border-color: #f8514966;
        }

        .toggle-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        .refresh-log {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: #8b949e;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 0.2rem;
        }

        .log-badge {
            background: #21262d;
            padding: 0.25rem 0.75rem;
            border-radius: 16px;
            font-family: 'SF Mono', monospace;
            font-size: 0.75rem;
            border: 1px solid #30363d;
            color: #8b949e;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .log-badge svg {
            fill: #8b949e;
            width: 12px;
            height: 12px;
        }

        .helper-note {
            margin-top: 1.2rem;
            font-size: 0.78rem;
            color: #6e7681;
            text-align: center;
            border-top: 1px solid #21262d;
            padding-top: 1.2rem;
            line-height: 1.5;
        }

        .helper-note a {
            color: #58a6ff;
            text-decoration: none;
        }

        .helper-note a:hover {
            text-decoration: underline;
        }

        .error-shake {
            animation: shake 0.3s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px); }
            75% { transform: translateX(6px); }
        }
    </style>
</head>
<body>
    <div class="card">
        <!-- GitHub branding -->
        <div class="github-badge">
            <svg viewBox="0 0 16 16" version="1.1">
                <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
            </svg>
            GitHub Auto Refresher
            <span>1s</span>
        </div>

        <!-- URL input -->
        <div class="input-group">
            <label>
                <svg viewBox="0 0 16 16">
                    <path d="M7.775 3.275a.75.75 0 001.06 1.06l1.25-1.25a2 2 0 112.83 2.83l-2.5 2.5a2 2 0 01-2.83 0 .75.75 0 00-1.06 1.06 3.5 3.5 0 004.95 0l2.5-2.5a3.5 3.5 0 00-4.95-4.95l-1.25 1.25zm-4.69 9.64a2 2 0 010-2.83l2.5-2.5a2 2 0 012.83 0 .75.75 0 001.06-1.06 3.5 3.5 0 00-4.95 0l-2.5 2.5a3.5 3.5 0 004.95 4.95l1.25-1.25a.75.75 0 00-1.06-1.06l-1.25 1.25a2 2 0 01-2.83 0z"></path>
                </svg>
                Paste GitHub URL
            </label>
            <div class="url-input-wrapper" id="inputWrapper">
                <input type="url" id="urlInput" placeholder="https://github.com/username/repo" value="https://github.com/">
                <button id="loadBtn" title="Load URL (starts auto-refresh)">
                    <svg viewBox="0 0 16 16">
                        <path fill-rule="evenodd" d="M8 3a5 5 0 100 10A5 5 0 008 3zM2 8a6 6 0 1112 0A6 6 0 012 8z"></path>
                        <path fill-rule="evenodd" d="M8 5.5a.5.5 0 01.5.5v2.5H11a.5.5 0 010 1H8.5V12a.5.5 0 01-1 0V9.5H5a.5.5 0 010-1h2.5V6a.5.5 0 01.5-.5z"></path>
                    </svg>
                    Load
                </button>
            </div>
        </div>

        <!-- Status & control -->
        <div class="status-panel">
            <div class="status-left">
                <div class="pulse-dot idle" id="pulseDot"></div>
                <div class="status-text" id="statusText">
                    <strong>Idle</strong> — enter a URL
                </div>
            </div>
            <button class="toggle-btn" id="toggleBtn" disabled>
                <svg viewBox="0 0 16 16" id="toggleIcon">
                    <path d="M6.5 3.5a.5.5 0 01.5-.5h5a.5.5 0 01.5.5v9a.5.5 0 01-.5.5h-5a.5.5 0 01-.5-.5v-9zM2 3.5a.5.5 0 01.5-.5H6v9H2.5a.5.5 0 01-.5-.5v-9z"></path>
                </svg>
                <span id="toggleText">Stop</span>
            </button>
        </div>

        <!-- refresh counter -->
        <div class="refresh-log">
            <div class="log-badge">
                <svg viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 3a5 5 0 100 10A5 5 0 008 3zM2 8a6 6 0 1112 0A6 6 0 012 8z"></path>
                    <path fill-rule="evenodd" d="M8 5.5a.5.5 0 01.5.5v2.5H11a.5.5 0 010 1H8.5V12a.5.5 0 01-1 0V9.5H5a.5.5 0 010-1h2.5V6a.5.5 0 01.5-.5z"></path>
                </svg>
                <span id="refreshCount">0</span> refreshes
            </div>
            <div class="log-badge">
                <svg viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M8 15A7 7 0 108 1a7 7 0 000 14zm0-1.5a5.5 5.5 0 110-11 5.5 5.5 0 010 11zM8 4a.75.75 0 01.75.75v3.5a.75.75 0 01-1.5 0v-3.5A.75.75 0 018 4zm0 7a1 1 0 100-2 1 1 0 000 2z"></path>
                </svg>
                <span id="countdownDisplay">1s</span>
            </div>
        </div>

        <!-- tiny note -->
        <div class="helper-note">
            <span>⏱️ Refresh interval: <strong>1 second</strong> · Each refresh resets the timer.</span><br>
            <span>Works best with public GitHub pages. Some pages may block iframe embedding.</span>
        </div>
    </div>

    <script>
        (function(){
            // ---------- DOM elements ----------
            const urlInput = document.getElementById('urlInput');
            const loadBtn = document.getElementById('loadBtn');
            const inputWrapper = document.getElementById('inputWrapper');
            const pulseDot = document.getElementById('pulseDot');
            const statusText = document.getElementById('statusText');
            const toggleBtn = document.getElementById('toggleBtn');
            const toggleText = document.getElementById('toggleText');
            const toggleIcon = document.getElementById('toggleIcon');
            const refreshCountSpan = document.getElementById('refreshCount');
            const countdownDisplay = document.getElementById('countdownDisplay');

            // ---------- State ----------
            let currentUrl = 'https://github.com/';   // default
            let isActive = false;          // auto-refresh running?
            let refreshTimer = null;       // setInterval reference
            let countdownTimer = null;     // countdown interval (100ms)
            let refreshCount = 0;
            let remainingMs = 1000;        // countdown tracker

            // ---------- Helper: update status text ----------
            function setStatus(state, message) {
                if (state === 'active') {
                    pulseDot.classList.remove('idle');
                    statusText.innerHTML = `<strong>Auto‑refreshing</strong> — ${message || 'every 1s'}`;
                } else if (state === 'paused') {
                    pulseDot.classList.add('idle');
                    statusText.innerHTML = `<strong>Paused</strong> — ${message || 'click stop'}`;
                } else {
                    pulseDot.classList.add('idle');
                    statusText.innerHTML = `<strong>Idle</strong> — ${message || 'enter a URL'}`;
                }
            }

            // ---------- Update UI for active/inactive ----------
            function updateUIForActive(active) {
                if (active) {
                    toggleBtn.disabled = false;
                    toggleBtn.classList.remove('stop');
                    toggleText.innerText = 'Stop';
                    // change icon to stop square
                    toggleIcon.innerHTML = '<path fill-rule="evenodd" d="M5 3.5h6a1.5 1.5 0 011.5 1.5v6a1.5 1.5 0 01-1.5 1.5H5A1.5 1.5 0 013.5 11V5A1.5 1.5 0 015 3.5zM5 5v6h6V5H5z"></path>';
                } else {
                    // when idle or stopped, button shows "Start" if URL exists? 
                    // We'll keep it enabled if URL exists and not active -> allow restart
                    const url = urlInput.value.trim();
                    if (url) {
                        toggleBtn.disabled = false;
                        toggleText.innerText = 'Start';
                        toggleIcon.innerHTML = '<path fill-rule="evenodd" d="M4 3.5a.5.5 0 01.77-.42l7.5 4.5a.5.5 0 010 .84l-7.5 4.5A.5.5 0 014 12.5v-9z"></path>';
                    } else {
                        toggleBtn.disabled = true;
                        toggleText.innerText = 'Start';
                        toggleIcon.innerHTML = '<path fill-rule="evenodd" d="M4 3.5a.5.5 0 01.77-.42l7.5 4.5a.5.5 0 010 .84l-7.5 4.5A.5.5 0 014 12.5v-9z"></path>';
                    }
                }
            }

            // ---------- Reset countdown display ----------
            function resetCountdownDisplay() {
                remainingMs = 1000;
                countdownDisplay.innerText = '1s';
            }

            // ---------- Clear all timers ----------
            function clearAllTimers() {
                if (refreshTimer) {
                    clearInterval(refreshTimer);
                    refreshTimer = null;
                }
                if (countdownTimer) {
                    clearInterval(countdownTimer);
                    countdownTimer = null;
                }
                resetCountdownDisplay();
            }

            // ---------- Perform refresh action ----------
            function performRefresh() {
                if (!isActive) return;   // extra safety

                refreshCount++;
                refreshCountSpan.innerText = refreshCount;

                // Reload the current URL (the iframe/hidden reload approach)
                // We use a hidden iframe trick? Actually to "refresh itself" we can just re-assign the URL to an iframe.
                // But the requirement says: "Url auto reloader auto refresh . Add where i put link and every sec 1 it refresh itself"
                // Since this is a standalone page, we can simulate by reloading an iframe. But it might be blocked by GitHub's X-Frame-Options.
                // Instead we can use a more straightforward approach: Open a new window? Not ideal.
                // But the user asked for "refresh itself" — we can interpret as the page will re-fetch the URL every second using an iframe, but that often fails.
                // Better: We can navigate to the URL itself? That would leave this page. Not good.
                // So we'll show a visual counter and open a new tab? Hmm.
                // Actually, the most sensible "auto refresh" for a webpage is to reload the entire page, but that would reset the counter.
                // Since the task is to build a "GitHub URL auto refresher" tool — we'll use an iframe to load the URL, and refresh the iframe every second.
                // We'll create a hidden iframe container inside the card? Or just update an iframe. But GitHub blocks iframes.
                // Let's be transparent: we'll simulate by fetching? Not possible due to CORS.
                // So we'll implement a "reload" of the URL by reassigning the src of an iframe (which may not display if blocked).
                // However, the user likely wants to see the URL refreshing itself — maybe within the page context.
                // For demonstration, we'll create an iframe overlay? Let's embed an iframe inside the card? That would clutter.
                // Alternative: We can do a simple reload of the entire page? That would kill the timer.
                // Let's think: The core idea is to auto-refresh the URL every second. Since we can't easily embed GitHub, we can do:
                // - Keep a hidden iframe and reload it to simulate refresh. The user doesn't see the content but the count increments.
                // But that's not satisfying.
                // Given the constraints, we'll show a small notification that "refresh triggered". Plus we open a new tab? No.
                // Better: Use window.open with the URL? That would pop up every second — terrible.
                // I'll implement a hidden iframe reload, and also show an alert-like counter. And mention in the UI that GitHub may block embedding.
                // For demo purposes, we can also show the URL in an iframe that is visible if possible.
                // Let's add a small iframe preview area? But card is not designed for that.
                // Decision: We'll create an iframe (hidden by default) and reload it. It won't be visible, but the refresh mechanism is real.
                // We also update the counter and show a small timestamp.

                // But we can also show a "last refresh" time in the status? Not needed.

                // We'll create iframe if not exists
                let iframe = document.getElementById('refreshIframe');
                if (!iframe) {
                    iframe = document.createElement('iframe');
                    iframe.id = 'refreshIframe';
                    iframe.style.display = 'none';  // hidden: we just want the refresh action
                    iframe.setAttribute('sandbox', 'allow-scripts allow-same-origin'); // minimal
                    document.body.appendChild(iframe);
                }
                // Reload the URL
                try {
                    iframe.src = currentUrl;
                } catch (e) {
                    console.warn('iframe refresh error:', e);
                }

                // Reset the countdown display to 1s and restart countdown
                resetCountdownDisplay();

                // Optional: flash the pulse dot
                pulseDot.style.transform = 'scale(1.3)';
                setTimeout(() => { pulseDot.style.transform = ''; }, 100);
            }

            // ---------- Start auto-refresh ----------
            function startAutoRefresh() {
                if (isActive) return;

                // Ensure URL is set
                const url = urlInput.value.trim();
                if (!url) {
                    urlInput.focus();
                    inputWrapper.classList.add('error-shake');
                    setTimeout(() => inputWrapper.classList.remove('error-shake'), 300);
                    return;
                }

                currentUrl = url;
                isActive = true;
                refreshCount = 0;
                refreshCountSpan.innerText = '0';

                // Clear any existing timers
                clearAllTimers();

                // Update status
                setStatus('active', `refreshing ${url}`);
                updateUIForActive(true);
                toggleBtn.disabled = false;

                // Perform first refresh immediately? Or wait 1 sec? 
                // According to spec "every sec 1 it refresh itself" — we'll wait 1 sec before first refresh.
                // But we want to start countdown from 1s.
                resetCountdownDisplay();

                // Countdown update every 100ms for smooth display
                countdownTimer = setInterval(() => {
                    if (!isActive) return;
                    remainingMs -= 100;
                    if (remainingMs < 0) remainingMs = 0;
                    const secondsLeft = Math.max(0, remainingMs / 1000);
                    countdownDisplay.innerText = secondsLeft.toFixed(1) + 's';
                }, 100);

                // Refresh timer every 1000ms
                refreshTimer = setInterval(() => {
                    if (!isActive) return;
                    performRefresh();
                }, 1000);

                // Also we want to visually update countdown reset after each refresh: performRefresh resets remainingMs
                // But the countdown interval will overwrite display. We'll set remainingMs = 1000 inside performRefresh.

                // Override performRefresh to reset remainingMs? We'll adjust inside performRefresh.
                // Actually we need to reset remainingMs to 1000 inside performRefresh.
                // Let's modify performRefresh to reset remainingMs.
                const originalPerformRefresh = performRefresh;
                performRefresh = function() {
                    if (!isActive) return;
                    refreshCount++;
                    refreshCountSpan.innerText = refreshCount;
                    // reload iframe
                    let iframe = document.getElementById('refreshIframe');
                    if (!iframe) {
                        iframe = document.createElement('iframe');
                        iframe.id = 'refreshIframe';
                        iframe.style.display = 'none';
                        document.body.appendChild(iframe);
                    }
                    try {
                        iframe.src = currentUrl;
                    } catch (e) {}
                    // Reset countdown
                    remainingMs = 1000;
                    countdownDisplay.innerText = '1.0s';
                    // visual feedback
                    pulseDot.style.transform = 'scale(1.3)';
                    setTimeout(() => { pulseDot.style.transform = ''; }, 100);
                };

                // Reassign the timer to use new performRefresh
                if (refreshTimer) clearInterval(refreshTimer);
                refreshTimer = setInterval(() => {
                    if (!isActive) return;
                    performRefresh();
                }, 1000);

                // Make sure performRefresh also increments counter etc already inside.
                // But we've overridden it. We'll keep the new one.
                // But we also need to increment refreshCount and display. It's inside new performRefresh.
                // Also need to reset remainingMs inside new performRefresh.
                // Already done.
            }

            // ---------- Stop auto-refresh ----------
            function stopAutoRefresh() {
                if (!isActive) return;
                isActive = false;
                clearAllTimers();
                setStatus('idle', 'auto-refresh stopped');
                updateUIForActive(false);
                // keep countdown display as is, but reset to '1s' maybe
                countdownDisplay.innerText = '1s';
                // remove iframe? keep for later
            }

            // ---------- Load button handler ----------
            function onLoad() {
                const url = urlInput.value.trim();
                if (!url) {
                    inputWrapper.classList.add('error-shake');
                    setTimeout(() => inputWrapper.classList.remove('error-shake'), 300);
                    return;
                }
                // If active, stop current
                if (isActive) {
                    stopAutoRefresh();
                }
                currentUrl = url;
                // Update status
                setStatus('idle', `loaded: ${url}`);
                // Enable toggle button
                toggleBtn.disabled = false;
                toggleText.innerText = 'Start';
                toggleIcon.innerHTML = '<path fill-rule="evenodd" d="M4 3.5a.5.5 0 01.77-.42l7.5 4.5a.5.5 0 010 .84l-7.5 4.5A.5.5 0 014 12.5v-9z"></path>';
                // Reset count display
                refreshCount = 0;
                refreshCountSpan.innerText = '0';
                countdownDisplay.innerText = '1s';
                // We do NOT start automatically. The user must click Start.
                // But the spec: "every sec 1 it refresh itself" — maybe they expect auto-start on load?
                // But they also said "Add where i put link and every sec 1 it refresh itself" — probably means when I put link, it starts refreshing.
                // To be safe, we also have a Start button. But we can auto-start on Load click? Hmm.
                // Let's make Load also start the auto-refresh immediately (so it's one-click).
                // But then Stop button will be there to stop.
                // We'll start automatically after loading.
                startAutoRefresh();
            }

            // ---------- Toggle button (start/stop) ----------
            function onToggle() {
                if (isActive) {
                    stopAutoRefresh();
                } else {
                    // start
                    const url = urlInput.value.trim();
                    if (!url) {
                        inputWrapper.classList.add('error-shake');
                        setTimeout(() => inputWrapper.classList.remove('error-shake'), 300);
                        return;
                    }
                    currentUrl = url;
                    startAutoRefresh();
                }
            }

            // ---------- Event listeners ----------
            loadBtn.addEventListener('click', onLoad);
            toggleBtn.addEventListener('click', onToggle);

            // Allow pressing Enter in the input to trigger load
            urlInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    onLoad();
                }
            });

            // When user types, we enable/disable toggle button based on content (if not active)
            urlInput.addEventListener('input', () => {
                if (!isActive) {
                    const hasText = urlInput.value.trim().length > 0;
                    toggleBtn.disabled = !hasText;
                    if (hasText) {
                        toggleText.innerText = 'Start';
                        toggleIcon.innerHTML = '<path fill-rule="evenodd" d="M4 3.5a.5.5 0 01.77-.42l7.5 4.5a.5.5 0 010 .84l-7.5 4.5A.5.5 0 014 12.5v-9z"></path>';
                    } else {
                        toggleBtn.disabled = true;
                    }
                }
            });

            // ---------- Initialise on page load ----------
            (function init() {
                // set default URL in input
                urlInput.value = 'https://github.com/';
                currentUrl = 'https://github.com/';
                setStatus('idle', 'ready — press Load or Start');
                toggleBtn.disabled = false;
                toggleText.innerText = 'Start';
                toggleIcon.innerHTML = '<path fill-rule="evenodd" d="M4 3.5a.5.5 0 01.77-.42l7.5 4.5a.5.5 0 010 .84l-7.5 4.5A.5.5 0 014 12.5v-9z"></path>';
                refreshCountSpan.innerText = '0';
                countdownDisplay.innerText = '1s';
                // Ensure no active timers
                clearAllTimers();
            })();

            // patch: ensure performRefresh resets remainingMs and countdown display
            // We'll redefine performRefresh to be safe.
            const originalPerformRefreshGlobal = performRefresh;
            performRefresh = function() {
                if (!isActive) return;
                refreshCount++;
                refreshCountSpan.innerText = refreshCount;
                // reload iframe
                let iframe = document.getElementById('refreshIframe');
                if (!iframe) {
                    iframe = document.createElement('iframe');
                    iframe.id = 'refreshIframe';
                    iframe.style.display = 'none';
                    document.body.appendChild(iframe);
                }
                try {
                    iframe.src = currentUrl;
                } catch (e) {}
                // Reset countdown
                remainingMs = 1000;
                countdownDisplay.innerText = '1.0s';
                // visual pulse
                pulseDot.style.transform = 'scale(1.3)';
                setTimeout(() => { pulseDot.style.transform = ''; }, 100);
            };

            // Rebind startAutoRefresh and timers to use the new performRefresh
            // We'll override startAutoRefresh
            const originalStart = startAutoRefresh;
            startAutoRefresh = function() {
                if (isActive) return;
                const url = urlInput.value.trim();
                if (!url) return;

                currentUrl = url;
                isActive = true;
                refreshCount = 0;
                refreshCountSpan.innerText = '0';
                clearAllTimers();

                setStatus('active', `refreshing ${url}`);
                updateUIForActive(true);
                toggleBtn.disabled = false;

                resetCountdownDisplay();
                remainingMs = 1000;

                // countdown timer
                countdownTimer = setInterval(() => {
                    if (!isActive) return;
                    remainingMs -= 100;
                    if (remainingMs < 0) remainingMs = 0;
                    const secondsLeft = Math.max(0, remainingMs / 1000);
                    countdownDisplay.innerText = secondsLeft.toFixed(1) + 's';
                }, 100);

                // refresh timer
                refreshTimer = setInterval(() => {
                    if (!isActive) return;
                    performRefresh();
                }, 1000);
            };

            // override stopAutoRefresh to use new clear
            const originalStop = stopAutoRefresh;
            stopAutoRefresh = function() {
                if (!isActive) return;
                isActive = false;
                clearAllTimers();
                setStatus('idle', 'auto-refresh stopped');
                updateUIForActive(false);
                countdownDisplay.innerText = '1s';
            };

            // Rebind functions to global scope
            window.startAutoRefresh = startAutoRefresh;
            window.stopAutoRefresh = stopAutoRefresh;
            window.performRefresh = performRefresh;

            // Re-assign event handlers to use the new functions
            loadBtn.onclick = function() {
                const url = urlInput.value.trim();
                if (!url) {
                    inputWrapper.classList.add('error-shake');
                    setTimeout(() => inputWrapper.classList.remove('error-shake'), 300);
                    return;
                }
                if (isActive) stopAutoRefresh();
                currentUrl = url;
                setStatus('idle', `loaded: ${url}`);
                toggleBtn.disabled = false;
                toggleText.innerText = 'Start';
                toggleIcon.innerHTML = '<path fill-rule="evenodd" d="M4 3.5a.5.5 0 01.77-.42l7.5 4.5a.5.5 0 010 .84l-7.5 4.5A.5.5 0 014 12.5v-9z"></path>';
                refreshCount = 0;
                refreshCountSpan.innerText = '0';
                countdownDisplay.innerText = '1s';
                startAutoRefresh();  // auto-start after load
            };

            toggleBtn.onclick = function() {
                if (isActive) {
                    stopAutoRefresh();
                } else {
                    const url = urlInput.value.trim();
                    if (!url) {
                        inputWrapper.classList.add('error-shake');
                        setTimeout(() => inputWrapper.classList.remove('error-shake'), 300);
                        return;
                    }
                    currentUrl = url;
                    startAutoRefresh();
                }
            };

            // Input listener redefined
            urlInput.addEventListener('input', function() {
                if (!isActive) {
                    const hasText = urlInput.value.trim().length > 0;
                    toggleBtn.disabled = !hasText;
                    if (hasText) {
                        toggleText.innerText = 'Start';
                        toggleIcon.innerHTML = '<path fill-rule="evenodd" d="M4 3.5a.5.5 0 01.77-.42l7.5 4.5a.5.5 0 010 .84l-7.5 4.5A.5.5 0 014 12.5v-9z"></path>';
                    } else {
                        toggleBtn.disabled = true;
                    }
                }
            });

            // final init
            (function finalInit() {
                urlInput.value = 'https://github.com/';
                currentUrl = 'https://github.com/';
                setStatus('idle', 'ready — press Load or Start');
                toggleBtn.disabled = false;
                toggleText.innerText = 'Start';
                toggleIcon.innerHTML = '<path fill-rule="evenodd" d="M4 3.5a.5.5 0 01.77-.42l7.5 4.5a.5.5 0 010 .84l-7.5 4.5A.5.5 0 014 12.5v-9z"></path>';
                refreshCountSpan.innerText = '0';
                countdownDisplay.innerText = '1s';
                clearAllTimers();
                // remove any existing iframe
                const oldIframe = document.getElementById('refreshIframe');
                if (oldIframe) oldIframe.remove();
            })();
        })();
    </script>
</body>
</html>
